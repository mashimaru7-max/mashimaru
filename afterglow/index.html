<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10141e"><meta name="description" content="한 손가락으로 선을 연결하고 영역을 차지하는 달빛 땅따먹기 게임."><title>AFTERGLOW · 달빛 땅따먹기</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310141e'/%3E%3Cpath d='M7 24V8H24V15H15V24Z' fill='none' stroke='%2378e6ee' stroke-width='3'/%3E%3Ccircle cx='15' cy='24' r='3' fill='%23e7c792'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=2"></head>
<body><main id="app"><header><div><h1>AFTERGLOW</h1><p>MOONLIT POOL</p></div><button id="pause" type="button" aria-label="일시정지">Ⅱ</button></header>
<div class="stats"><span id="lives" aria-label="목숨 3개">♥ ♥ ♥</span><span id="score">000,000</span><span id="stage">STAGE 01</span></div>
<section id="board" aria-label="게임 영역"><canvas id="canvas" width="600" height="900" aria-label="방향키 또는 아래 십자패드로 조작하는 땅따먹기 게임"></canvas><div id="overlay"><div class="modal"><div id="eyebrow">ONE FINGER ARCADE · v0.2</div><h2 id="overlay-title">달빛 땅따먹기</h2><p id="overlay-copy">방향을 누르고, 손가락을 옮겨 꺾기.<br>손 놓으면 그린 길을 따라 자동 복귀.<br>주황색 적은 미완성 선을 노려!</p><button id="primary" type="button">한 판 시작</button><button id="secondary" type="button" hidden>처음부터 다시</button></div></div></section>
<div class="progress-label"><span id="area">점령 10.8%</span><span id="goal">목표 75%</span></div><div class="track" role="progressbar" aria-label="목표 달성률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div>
<div id="pad" role="group" aria-label="방향 조작 패드"><button class="direction up" data-dir="up" type="button" aria-label="위로 이동">↑</button><button class="direction left" data-dir="left" type="button" aria-label="왼쪽으로 이동">←</button><button class="return" data-dir="return" type="button" aria-label="그린 길을 따라 복귀">복귀</button><button class="direction right" data-dir="right" type="button" aria-label="오른쪽으로 이동">→</button><button class="direction down" data-dir="down" type="button" aria-label="아래로 이동">↓</button></div>
<p id="message" role="status" aria-live="polite">손 놓으면 자동 복귀 · 방향에 손가락 옮겨 꺾기</p>
<footer><label>이동 속도 <select id="speed"><option value="0.8">느리게</option><option value="1" selected>보통</option><option value="1.2">빠르게</option></select></label><button id="sound" aria-pressed="false" type="button">소리 꺼짐</button></footer>
</main><script type="module" src="app.js?v=2"></script></body></html>
