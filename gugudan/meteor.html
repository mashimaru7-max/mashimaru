<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142044">
  <title>구구단 운석 막기</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;background:#142044}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% -15%,#37578a,#182a51 50%,#101a38);overflow-x:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:3px solid #ffe086;outline-offset:3px}[hidden]{display:none!important}
    .stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff7 1px,transparent 1.5px),radial-gradient(#fff5 1px,transparent 1.5px);background-size:83px 91px,127px 109px;background-position:17px 24px,59px 73px}
    .app{position:relative;max-width:560px;min-height:100svh;margin:auto;padding:14px 15px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.back{color:#e2eaff;text-decoration:none;background:#ffffff1e;border:1px solid #ffffff34;border-radius:12px;padding:9px 11px;font-size:13px;font-weight:800}.logo{font-size:15px;font-weight:900;white-space:nowrap}.panel{background:#263b68f2;border:1px solid #aec2e35a;border-radius:25px;box-shadow:0 18px 40px #040b2490;padding:23px;text-align:center}.intro,.end{margin:auto 0}.icon{font-size:66px;line-height:1.2;margin-bottom:8px}.intro h1,.end h1{font-size:29px;letter-spacing:-.06em;margin:0 0 10px}.intro p,.end p{line-height:1.55;color:#d4e1f9;margin:0 0 22px}.level-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.level{padding:13px 8px;border-radius:16px;background:#344c7b;color:#fff;border:2px solid #6680aa;font-weight:850}.level small{display:block;margin-top:3px;color:#d2e0f8}.level.selected{background:#5464ae;border-color:#ffda87}.primary{width:100%;margin-top:18px;border:0;border-radius:17px;background:#ffcf70;box-shadow:0 5px 0 #c88b39;color:#3b3034;font-weight:950;font-size:20px;padding:15px}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #c88b39}.tip{font-size:12px!important;margin:15px 0 0!important;color:#bbcee9!important}
    .game{display:flex;flex:1;flex-direction:column;margin-top:15px}.hud{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:14px;font-weight:850;color:#e3edff}.hearts{font-size:21px;white-space:nowrap}.pause-button{border:1px solid #ffffff38;background:#ffffff19;color:#fff;border-radius:10px;min-width:38px;height:35px;font-size:18px}.question-box{text-align:center;background:#ffffff17;border:1px solid #ffffff4b;border-radius:20px;padding:9px 12px;margin:10px 0}.question-box small{font-size:12px;color:#c9daf6;font-weight:800}.equation{font-size:clamp(34px,10vw,48px);font-weight:950;line-height:1.17}.equation span{color:#ffdd80}.timer{height:7px;margin:0 4px 8px;border-radius:20px;overflow:hidden;background:#ffffff31}.timer-fill{height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,#75e4bb,#ffe37b);animation:drain var(--duration) linear forwards}@keyframes drain{to{transform:scaleX(0)}}
    .sky{position:relative;flex:1;min-height:310px;overflow:hidden;border:1px solid #8ea6d044;border-radius:22px;background:linear-gradient(#253d6b5e,#28396226 74%,#426c7c42)}.sky:after{content:"";position:absolute;left:0;right:0;bottom:46px;height:3px;background:#80d3d5;box-shadow:0 0 20px #7fedd8}.earth{position:absolute;z-index:1;bottom:-92px;left:-11%;width:122%;height:140px;border-radius:50% 50% 0 0;background:linear-gradient(#60b0ac,#357a91);border-top:6px solid #a2edcd;box-shadow:0 -9px 30px #4ed4ba78;pointer-events:none}.earth:after{content:"🏠  🌲   🏡  🌲";position:absolute;top:-6px;left:0;width:100%;text-align:center;font-size:24px;word-spacing:12px}
    .meteor{position:absolute;z-index:2;top:0;left:var(--left);width:var(--size);height:var(--size);border:3px solid #ffe9b6;border-radius:50%;padding:0;color:#463550;background:radial-gradient(circle at 30% 24%,#fff9c9,#ffc979 42%,#e58469 80%);box-shadow:0 0 20px #ffb86cbd,0 5px 0 #ba655b;font-weight:950;font-size:clamp(23px,7vw,35px);animation:fall var(--duration) linear forwards}.meteor:before{content:"";position:absolute;left:27%;bottom:78%;z-index:-1;width:46%;height:38px;background:linear-gradient(#ffb56b00,#ffca7bb0);clip-path:polygon(50% 0,100% 100%,0 100%)}@keyframes fall{from{transform:translate(-50%,15px)}to{transform:translate(-50%,var(--travel))}}.meteor.wrong{animation-play-state:paused;opacity:.3;filter:grayscale(1);pointer-events:none}.meteor.hit{animation-play-state:paused;scale:1.25;opacity:0;transition:scale .25s,opacity .25s}
    .message{position:absolute;z-index:4;left:12px;right:12px;bottom:88px;text-align:center;font-size:19px;font-weight:950;text-shadow:0 2px 8px #0b1537;pointer-events:none}.pause-overlay{position:absolute;z-index:5;inset:0;display:grid;place-content:center;gap:16px;text-align:center;background:#101a38df;font-size:24px;font-weight:950}.resume{border:0;border-radius:15px;background:#ffcf70;color:#3b3034;padding:12px 25px;font-size:18px;font-weight:900}.game.paused .meteor,.game.paused .timer-fill{animation-play-state:paused}.game-note{text-align:center;color:#c5d6ee;margin:9px 0 0;font-weight:700;font-size:12px}.end strong{color:#ffe18b;font-size:20px}
    @media(max-height:670px){.app{padding-top:7px;padding-bottom:7px}.game{margin-top:6px}.question-box{margin:5px 0}.sky{min-height:235px}.game-note{margin-top:4px}}@media(max-width:350px){.logo{font-size:13px}.hearts{font-size:18px}.earth:after{font-size:20px}}
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main class="app">
    <div class="top"><a class="back" href="./">← 구구단 연습</a><div class="logo">☄️ 구구단 운석 막기</div></div>
    <section class="panel intro" id="intro"><div class="icon" aria-hidden="true">🛡️</div><h1>정답 운석을 막아줘!</h1><p>문제를 보고 <strong>정답이 적힌 운석만</strong> 눌러!<br>10문제를 풀면 지구를 지킬 수 있어.</p><div class="level-row" role="group" aria-label="단 선택"><button class="level selected" type="button" data-max="5" aria-pressed="true">처음 시작<small>2~5단 · 천천히</small></button><button class="level" type="button" data-max="9" aria-pressed="false">도전하기<small>2~9단 · 빠르게</small></button></div><button class="primary" id="start" type="button">지구 지키기 🚀</button><p class="tip">운석을 놓쳐도 다음 문제로 계속할 수 있어.</p></section>
    <section class="game" id="game" aria-label="운석 막기 게임" hidden><div class="hud"><span id="round">1 / 10</span><span class="hearts" id="hearts" aria-label="남은 기회 3개">❤️❤️❤️</span><button class="pause-button" id="pause" type="button" aria-label="게임 일시정지">Ⅱ</button></div><div class="question-box"><small>정답 운석만 터치!</small><div class="equation" id="equation" aria-live="polite"></div></div><div class="timer"><div class="timer-fill" id="timerFill"></div></div><div class="sky" id="sky"><div class="earth" aria-hidden="true"></div><div class="message" id="message" role="status" aria-live="polite"></div><div class="pause-overlay" id="pauseOverlay" hidden>잠깐 쉬는 중 💤<button class="resume" id="resume" type="button">계속하기</button></div></div><p class="game-note">틀린 운석을 누르거나 정답을 놓치면 하트가 줄어들어.</p></section>
    <section class="panel end" id="end" hidden><div class="icon" id="endIcon" aria-hidden="true">🌎</div><h1 id="endTitle"></h1><p id="endMessage"></p><button class="primary" id="retry" type="button">다시 도전하기</button></section>
  </main>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const random = n => Math.floor(Math.random() * n);
      const shuffle = input => { const list=[...input]; for(let i=list.length-1;i>0;i--){const j=random(i+1);[list[i],list[j]]=[list[j],list[i]]} return list };
      const state = { max:5, questions:[], round:0, hits:0, lives:3, phase:'intro', wave:0, paused:false, remaining:0, started:0, waveTimer:null, nextTimer:null };
      const show = id => { for(const name of ['intro','game','end']) $(name).hidden=name!==id };
      function cancelTimers(){clearTimeout(state.waveTimer);clearTimeout(state.nextTimer);state.waveTimer=null;state.nextTimer=null}
      function makeQuestions(){const pool=[];for(let a=2;a<=state.max;a++)for(let b=1;b<=9;b++)pool.push({a,b,answer:a*b});return shuffle(pool).slice(0,10)}
      function choices(q){const values=new Set([q.answer]);const other=shuffle([q.a*(q.b+1),q.a*Math.max(1,q.b-1),q.answer-1,q.answer+1,q.answer+q.b,q.answer+2,q.answer-2].filter(n=>n>0&&n!==q.answer));for(const n of other){values.add(n);if(values.size===4)break}for(let n=1;values.size<4;n++)values.add(q.answer+n);return shuffle([...values])}
      function updateHearts(){ $('hearts').textContent='❤️'.repeat(state.lives)+'🤍'.repeat(3-state.lives);$('hearts').setAttribute('aria-label',`남은 기회 ${state.lives}개`) }
      function finish(){cancelTimers();state.phase='end';state.paused=false;const survived=state.lives>0;$('endIcon').textContent=survived?'🌎':'🛸';$('endTitle').textContent=survived?'지구를 지켰어!':'다시 한번 해보자!';$('endMessage').innerHTML=`<strong>${state.hits} / 10개 성공</strong><br>${survived?'정답 운석을 잘 찾아냈어!':'괜찮아, 다시 하면 더 잘할 수 있어!'}`;show('end')}
      function scheduleMiss(wave){state.started=Date.now();state.waveTimer=setTimeout(()=>{if(state.wave!==wave||state.phase!=='playing'||state.paused)return;resolve(false)},state.remaining)}
      function resolve(correct){if(state.phase!=='playing')return;state.phase='resolved';clearTimeout(state.waveTimer);state.waveTimer=null;const q=state.questions[state.round];$('sky').querySelectorAll('.meteor').forEach(m=>{m.disabled=true;m.style.animationPlayState='paused';if(correct&&Number(m.textContent)===q.answer)m.classList.add('hit')});if(correct){state.hits++;$('message').textContent='정답! 운석 방어 성공 ✨'}else{state.lives--;updateHearts();$('message').textContent=`아깝다! 정답은 ${q.answer}`};const wave=state.wave;state.nextTimer=setTimeout(()=>{if(state.wave!==wave)return;if(state.lives===0){finish();return}state.round++;launchWave()},correct?570:1000)}
      function launchWave(){cancelTimers();$('sky').querySelectorAll('.meteor').forEach(m=>m.remove());$('message').textContent='';if(state.round>=10){finish();return}state.wave++;state.phase='playing';const q=state.questions[state.round];$('round').textContent=`${state.round+1} / 10`;$('equation').innerHTML=`${q.a} × ${q.b} = <span>?</span>`;const sky=$('sky');const size=Math.min(76,Math.max(54,sky.clientWidth/5.8));const travel=Math.max(150,sky.clientHeight-size-60);const duration=state.max===5?12000:10000;state.remaining=duration;$('timerFill').style.setProperty('--duration',`${duration}ms`);$('timerFill').style.animation='none';void $('timerFill').offsetWidth;$('timerFill').style.animation='';const wave=state.wave;choices(q).forEach((value,i)=>{const m=document.createElement('button');m.type='button';m.className='meteor';m.textContent=value;m.setAttribute('aria-label',`${value} 운석`);m.style.setProperty('--left',`${[14,38,62,86][i]}%`);m.style.setProperty('--size',`${size}px`);m.style.setProperty('--travel',`${travel}px`);m.style.setProperty('--duration',`${duration}ms`);m.addEventListener('click',()=>{if(state.wave!==wave||state.phase!=='playing'||state.paused||m.disabled)return;if(value===q.answer){resolve(true);return}m.disabled=true;m.classList.add('wrong');state.lives--;updateHearts();$('message').textContent='앗! 다른 숫자야';if(state.lives===0){state.phase='resolved';cancelTimers();$('sky').querySelectorAll('.meteor').forEach(item=>{item.disabled=true;item.style.animationPlayState='paused'});state.nextTimer=setTimeout(finish,700)}});sky.append(m)});scheduleMiss(wave)}
      function start(){cancelTimers();state.wave++;state.questions=makeQuestions();state.round=0;state.hits=0;state.lives=3;state.paused=false;$('game').classList.remove('paused');$('pauseOverlay').hidden=true;updateHearts();show('game');launchWave()}
      function pause(){if(state.phase!=='playing'||state.paused)return;state.paused=true;state.remaining=Math.max(0,state.remaining-(Date.now()-state.started));clearTimeout(state.waveTimer);state.waveTimer=null;$('game').classList.add('paused');$('pauseOverlay').hidden=false}
      function resume(){if(!state.paused)return;state.paused=false;$('game').classList.remove('paused');$('pauseOverlay').hidden=true;scheduleMiss(state.wave)}
      document.querySelectorAll('.level').forEach(button=>button.addEventListener('click',()=>{state.max=Number(button.dataset.max);document.querySelectorAll('.level').forEach(item=>{const selected=item===button;item.classList.toggle('selected',selected);item.setAttribute('aria-pressed',selected)})}));
      $('start').addEventListener('click',start);$('retry').addEventListener('click',start);$('pause').addEventListener('click',pause);$('resume').addEventListener('click',resume);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
    })();
  </script>
</body>
</html>
