<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a39">
  <title>구구단 운석 막기</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;background:#101a39}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% -10%,#334e80,#142546 56%,#0e1832);overflow-x:hidden}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #ffe49b;outline-offset:4px}.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff9 1px,transparent 1.5px),radial-gradient(#fff7 1px,transparent 1.5px);background-size:79px 87px,113px 107px;background-position:15px 30px,64px 9px}.app{position:relative;max-width:580px;min-height:100svh;margin:auto;padding:18px 16px 27px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.back{color:#e1eaff;background:#ffffff1b;text-decoration:none;border:1px solid #ffffff37;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:750}.logo{font-size:14px;font-weight:900;letter-spacing:-.03em}.panel{background:#1e3158df;border:1px solid #7891b960;border-radius:25px;box-shadow:0 15px 30px #02071655;padding:23px;text-align:center}.intro,.end{margin:auto 0}.intro .icon,.end .icon{font-size:65px;margin:0 0 7px}.intro h1,.end h1{margin:0 0 8px;font-size:29px;letter-spacing:-.06em}.intro p,.end p{line-height:1.55;color:#d0def8;margin:0 0 21px}.level-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.level{padding:13px 8px;border-radius:15px;background:#30446f;color:white;border:2px solid #52688e;font-weight:850}.level small{display:block;margin-top:3px;color:#cbd8f2;font-weight:600}.level.selected{background:#455aa1;border-color:#fbd581}.primary{width:100%;margin-top:18px;border:0;border-radius:17px;background:#ffca6b;box-shadow:0 5px 0 #cf923f;color:#382e36;font-weight:950;font-size:20px;padding:15px}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #cf923f}.game[hidden],.intro[hidden],.end[hidden]{display:none}.game{display:flex;flex:1;flex-direction:column;margin-top:14px}.hud{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:850;color:#dce8ff}.hearts{font-size:23px;letter-spacing:2px}.question-box{text-align:center;background:#ffffff18;border:1px solid #ffffff40;border-radius:19px;margin:11px 0 0;padding:9px 12px}.question-box small{display:block;font-weight:750;color:#c4d5ed;font-size:12px}.equation{font-size:clamp(31px,9vw,45px);font-weight:950;line-height:1.15;letter-spacing:-.04em}.equation span{color:#ffda7d}.sky{position:relative;flex:1;min-height:350px;margin-top:10px;overflow:hidden;border-radius:22px;background:linear-gradient(#243b6666,#17244828 80%,#31487033);border:1px solid #ffffff22}.sky:before{content:"";position:absolute;bottom:9px;left:0;right:0;height:3px;background:#ffc876a1;box-shadow:0 0 18px #ffcc83}.earth{position:absolute;bottom:-94px;left:-12%;width:124%;height:136px;border-radius:50% 50% 0 0;background:#3c8e97;border-top:7px solid #84d4bd;box-shadow:0 -12px 35px #67cab083}.earth:after{content:"🏠    🌲       🏡     🌲";position:absolute;top:0;left:0;width:100%;text-align:center;font-size:23px;word-spacing:15px}.meteor{position:absolute;top:0;left:var(--left);width:var(--size);height:var(--size);padding:0;border:3px solid #ffe0a1;border-radius:50%;background:radial-gradient(circle at 32% 25%,#fff2b6,#f5a858 40%,#ca6353 90%);color:#382f50;font-size:clamp(24px,7vw,35px);font-weight:950;box-shadow:0 0 22px #ffaf6a88,0 7px 0 #b95b52;transform:translate(-50%,-90px);animation:fall var(--duration) linear forwards;z-index:2;touch-action:manipulation}.meteor:before{content:"";position:absolute;z-index:-1;left:22%;bottom:78%;width:56%;height:50px;background:linear-gradient(#ffb67400,#ffbb70a8);clip-path:polygon(50% 0,100% 100%,0 100%)}.meteor.burst{animation:none;transform:translate(-50%,var(--last-y));opacity:0;transition:opacity .25s,scale .25s;scale:1.55}.meteor.wrong{filter:grayscale(.8);animation-play-state:paused;opacity:.35;pointer-events:none}@keyframes fall{from{transform:translate(-50%,-90px)}to{transform:translate(-50%,var(--travel))}}.toast{position:absolute;z-index:3;left:10px;right:10px;bottom:82px;text-align:center;pointer-events:none;font-size:18px;font-weight:900;text-shadow:0 2px 8px #111c38}.tip{text-align:center;color:#a9c1df;font-weight:700;font-size:12px;margin:11px 0 0}@media(max-height:680px){.app{padding-top:9px;padding-bottom:10px}.game{margin-top:6px}.question-box{margin-top:5px}.sky{min-height:260px}.tip{margin:5px 0 0}}@media(prefers-reduced-motion:reduce){.meteor{animation-duration:15s!important}}
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main class="app">
    <div class="top"><a class="back" href="./">← 구구단 연습</a><div class="logo">☄️ 구구단 운석 막기</div></div>
    <section class="panel intro" id="intro"><div class="icon" aria-hidden="true">🛡️</div><h1>정답 운석을 막아줘!</h1><p>위의 구구단을 풀고<br><strong>정답 숫자가 적힌 운석만</strong> 톡! 눌러줘.</p><div class="level-row" role="group" aria-label="단 선택"><button class="level selected" type="button" data-max="5" aria-pressed="true">처음 시작<small>2~5단</small></button><button class="level" type="button" data-max="9" aria-pressed="false">도전하기<small>2~9단</small></button></div><button class="primary" id="start" type="button">지구 지키기 🚀</button><p class="tip">시간이 지나도 괜찮아. 다시 도전하면 돼!</p></section>
    <section class="game" id="game" aria-label="운석 막기 게임" hidden><div class="hud"><span id="round">1 / 10</span><span class="hearts" id="hearts" aria-label="남은 기회 3개">❤️❤️❤️</span></div><div class="question-box"><small>정답 운석을 터치!</small><div class="equation" id="equation" aria-live="polite"></div></div><div class="sky" id="sky"><div class="earth" aria-hidden="true"></div><div class="toast" id="toast" role="status" aria-live="polite"></div></div><p class="tip">맞는 답만 눌러! 틀린 답을 누르면 기회가 줄어들어.</p></section>
    <section class="panel end" id="end" hidden><div class="icon" id="endIcon" aria-hidden="true">🌎</div><h1 id="endTitle"></h1><p id="endMessage"></p><button class="primary" id="retry" type="button">다시 도전하기</button></section>
  </main>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const rand = n => Math.floor(Math.random() * n);
      const shuffle = values => { const a = [...values]; for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]} return a };
      let max=5, questions=[], round=0, lives=3, active=false, timeout=null, locked=false;
      function show(id){for(const name of ['intro','game','end']) $(name).hidden=name!==id}
      function clearRound(){clearTimeout(timeout);timeout=null;active=false;for(const m of $('sky').querySelectorAll('.meteor')) m.remove()}
      function buildQuestions(){const pool=[];for(let a=2;a<=max;a++)for(let b=1;b<=9;b++)pool.push({a,b,answer:a*b});return shuffle(pool).slice(0,10)}
      function options(q){const values=new Set([q.answer]);const others=shuffle([q.a*(q.b+1),q.a*Math.max(1,q.b-1),q.answer-1,q.answer+1,q.answer+q.b,q.answer+2,q.answer-2].filter(v=>v>0&&v!==q.answer));for(const n of others){values.add(n);if(values.size===4)break}for(let n=1;values.size<4;n++)values.add(q.answer+n);return shuffle([...values])}
      function lose(reason){if(!active||locked)return;lives--; $('hearts').textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives);$('hearts').setAttribute('aria-label',`남은 기회 ${lives}개`);$('toast').textContent=reason;if(lives===0){locked=true;clearRound();timeout=setTimeout(()=>finish(false),700)}}
      function next(){clearRound();locked=false;$('toast').textContent='';if(round===10){finish(true);return}const q=questions[round];$('round').textContent=`${round+1} / 10`;$('equation').innerHTML=`${q.a} × ${q.b} = <span>?</span>`;const sky=$('sky');const size=Math.min(76,Math.max(62,sky.clientWidth/5.4));const travel=Math.max(170,sky.clientHeight-size-24);const duration=max===5?10500:9000;const laneCenters=[.14,.38,.62,.86];const answers=options(q);active=true;
        answers.forEach((value,i)=>{const meteor=document.createElement('button');meteor.type='button';meteor.className='meteor';meteor.textContent=value;meteor.setAttribute('aria-label',`${value} 운석`);meteor.style.setProperty('--left',`${laneCenters[i]*100}%`);meteor.style.setProperty('--size',`${size}px`);meteor.style.setProperty('--travel',`${travel}px`);meteor.style.setProperty('--duration',`${duration}ms`);meteor.addEventListener('click',()=>{if(!active||locked||meteor.disabled)return;if(value!==q.answer){meteor.disabled=true;meteor.classList.add('wrong');lose('앗, 다른 운석이야!');return}locked=true;active=false;$('toast').textContent='정답! 운석 막기 성공 ✨';for(const m of sky.querySelectorAll('.meteor'))m.disabled=true;meteor.style.setProperty('--last-y',getComputedStyle(meteor).transform==='none'?'0px':`${meteor.getBoundingClientRect().top-sky.getBoundingClientRect().top}px`);meteor.classList.add('burst');timeout=setTimeout(()=>{round++;next()},650)});sky.append(meteor)});
        timeout=setTimeout(()=>{if(!active||locked)return;lose(`정답은 ${q.answer}! 다음엔 막아보자`);if(lives>0){locked=true;timeout=setTimeout(next,900)}},duration);
      }
      function finish(won){clearRound();$('endIcon').textContent=won?'🌎':'🛸';$('endTitle').textContent=won?'지구를 지켰어!':'다시 한번 해보자!';$('endMessage').textContent=won?'10개의 정답 운석을 모두 막았어. 대단해!':`${round}개 막았어! 조금만 더 연습하면 할 수 있어.`;show('end')}
      function start(){clearRound();questions=buildQuestions();round=0;lives=3;locked=false;$('hearts').textContent='❤️❤️❤️';$('hearts').setAttribute('aria-label','남은 기회 3개');show('game');next()}
      document.querySelectorAll('.level').forEach(button=>button.addEventListener('click',()=>{max=Number(button.dataset.max);document.querySelectorAll('.level').forEach(item=>{const selected=item===button;item.classList.toggle('selected',selected);item.setAttribute('aria-pressed',selected)})}));
      $('start').addEventListener('click',start);$('retry').addEventListener('click',start);
    })();
  </script>
</body>
</html>
