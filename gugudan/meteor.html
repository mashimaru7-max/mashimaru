<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142044">
  <title>구구단 운석 막기</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;background:#142044}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% -15%,#37578a,#182a51 52%,#101a38);overflow-x:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:3px solid #ffe086;outline-offset:3px}[hidden]{display:none!important}
    .stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff7 1px,transparent 1.5px),radial-gradient(#fff5 1px,transparent 1.5px);background-size:83px 91px,127px 109px;background-position:17px 24px,59px 73px}.app{position:relative;max-width:560px;min-height:100svh;margin:auto;padding:14px 15px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.back{color:#e2eaff;text-decoration:none;background:#ffffff1e;border:1px solid #ffffff34;border-radius:12px;padding:9px 11px;font-size:13px;font-weight:800}.logo{font-size:15px;font-weight:900;white-space:nowrap}
    .panel{background:#263b68f2;border:1px solid #aec2e35a;border-radius:25px;box-shadow:0 18px 40px #040b2490;padding:23px;text-align:center}.intro,.end{margin:auto 0}.icon{font-size:66px;line-height:1.2;margin-bottom:8px}.intro h1,.end h1{font-size:29px;letter-spacing:-.06em;margin:0 0 10px}.intro p,.end p{line-height:1.55;color:#d4e1f9;margin:0 0 22px}.example{background:#17264a;border:1px solid #758ebc;border-radius:15px;padding:12px;margin:0 0 20px;font-weight:850;color:#ffdc88}.example span{display:inline-block;margin:0 7px}.level-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.level{padding:13px 8px;border-radius:16px;background:#344c7b;color:#fff;border:2px solid #6680aa;font-weight:850}.level small{display:block;margin-top:3px;color:#d2e0f8}.level.selected{background:#5464ae;border-color:#ffda87}.primary{width:100%;margin-top:18px;border:0;border-radius:17px;background:#ffcf70;box-shadow:0 5px 0 #c88b39;color:#3b3034;font-weight:950;font-size:20px;padding:15px}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #c88b39}.tip{font-size:12px!important;margin:16px 0 0!important;color:#bbcee9!important}
    .game{display:flex;flex:1;flex-direction:column;margin-top:14px}.hud{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:15px;font-weight:900}.score{color:#ffe095;font-size:20px}.speed{color:#cde9ff;font-size:12px;white-space:nowrap;background:#ffffff1a;border-radius:10px;padding:6px 8px}.hearts{font-size:21px;white-space:nowrap}.pause-button{border:1px solid #ffffff38;background:#ffffff19;color:#fff;border-radius:10px;min-width:38px;height:35px;font-size:18px}.instruction{text-align:center;background:#ffffff16;border:1px solid #ffffff3d;border-radius:15px;padding:12px 8px;margin:11px 0 10px;font-size:16px;font-weight:850}.instruction strong{color:#ffe097}
    .sky{position:relative;flex:1;min-height:320px;overflow:hidden;border:1px solid #8ea6d044;border-radius:22px;background:linear-gradient(#253d6b5e,#28396226 74%,#426c7c42)}.sky:after{content:"";position:absolute;left:0;right:0;bottom:46px;height:3px;background:#80d3d5;box-shadow:0 0 20px #7fedd8}.earth{position:absolute;z-index:1;bottom:-92px;left:-11%;width:122%;height:140px;border-radius:50% 50% 0 0;background:linear-gradient(#60b0ac,#357a91);border-top:6px solid #a2edcd;box-shadow:0 -9px 30px #4ed4ba78;pointer-events:none}.earth:after{content:"🏠  🌲   🏡  🌲";position:absolute;top:-6px;left:0;width:100%;text-align:center;font-size:24px;word-spacing:12px}
    .meteor{position:absolute;z-index:2;top:0;left:var(--left);width:var(--width);height:74px;border:3px solid #ffe9b6;border-radius:35px;padding:0 5px;color:#49374c;background:radial-gradient(circle at 25% 20%,#fff9cc,#ffc879 48%,#e48469 90%);box-shadow:0 0 18px #ffb86c99,0 5px 0 #ba655b;font-size:clamp(18px,5.4vw,24px);font-weight:950;white-space:nowrap;animation:fall var(--duration) linear forwards}.meteor:before{content:"";position:absolute;z-index:-1;bottom:79%;left:36%;width:28%;height:34px;background:linear-gradient(#ffb56b00,#ffca7bb0);clip-path:polygon(50% 0,100% 100%,0 100%)}@keyframes fall{from{transform:translate(-50%,8px)}to{transform:translate(-50%,var(--travel))}}.meteor.hit,.meteor.wrong{animation-play-state:paused;opacity:0;transition:opacity .25s,scale .25s}.meteor.hit{scale:1.25}.meteor.wrong{scale:.8;filter:grayscale(1)}
    .message{position:absolute;z-index:4;left:12px;right:12px;bottom:87px;text-align:center;font-size:20px;font-weight:950;text-shadow:0 2px 8px #0b1537;pointer-events:none}.pause-overlay{position:absolute;z-index:5;inset:0;display:grid;place-content:center;gap:16px;text-align:center;background:#101a38df;font-size:24px;font-weight:950}.resume{border:0;border-radius:15px;background:#ffcf70;color:#3b3034;padding:12px 25px;font-size:18px;font-weight:900}.game.paused .meteor{animation-play-state:paused}.game-note{text-align:center;color:#c5d6ee;margin:9px 0 0;font-weight:700;font-size:12px}.end strong{color:#ffe18b;font-size:23px}
    @media(max-height:670px){.app{padding-top:7px;padding-bottom:7px}.game{margin-top:6px}.instruction{margin:5px 0}.sky{min-height:240px}.game-note{margin-top:4px}}@media(max-width:350px){.logo{font-size:13px}.hearts{font-size:18px}.meteor{height:66px;font-size:17px}.earth:after{font-size:20px}}
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main class="app">
    <div class="top"><a class="back" href="./">← 구구단 연습</a><div class="logo">☄️ 구구단 운석 막기</div></div>
    <section class="panel intro" id="intro"><div class="icon" aria-hidden="true">🛡️</div><h1>맞는 식만 터치!</h1><p>문제와 답이 적힌 운석이 계속 떨어져.<br><strong>계산이 맞는 운석만</strong> 골라서 눌러줘!</p><div class="example"><span>3 × 4 = 12 ✅</span><span>3 × 4 = 15 ❌</span></div><div class="level-row" role="group" aria-label="단 선택"><button class="level selected" type="button" data-max="5" aria-pressed="true">처음 시작<small>2~5단 · 천천히</small></button><button class="level" type="button" data-max="9" aria-pressed="false">도전하기<small>2~9단 · 빠르게</small></button></div><button class="primary" id="start" type="button">지구 지키기 🚀</button><p class="tip">맞는 식 +1점 · 틀린 식을 누르면 목숨 −1</p></section>
    <section class="game" id="game" aria-label="운석 막기 게임" hidden><div class="hud"><span class="score" id="score">⭐ 0점</span><span class="speed" id="speed">🚀 속도 1</span><span class="hearts" id="hearts" aria-label="남은 목숨 3개">❤️❤️❤️</span><button class="pause-button" id="pause" type="button" aria-label="게임 일시정지">Ⅱ</button></div><div class="instruction"><strong>계산이 맞는 운석만</strong> 터치!</div><div class="sky" id="sky"><div class="earth" aria-hidden="true"></div><div class="message" id="message" role="status" aria-live="polite"></div><div class="pause-overlay" id="pauseOverlay" hidden>잠깐 쉬는 중 💤<button class="resume" id="resume" type="button">계속하기</button></div></div><p class="game-note">운석을 그냥 지나쳐도 목숨은 줄지 않아.</p></section>
    <section class="panel end" id="end" hidden><div class="icon" aria-hidden="true">🌟</div><h1>이번 기록은?</h1><p id="endMessage"></p><button class="primary" id="retry" type="button">한 번 더 하기</button></section>
  </main>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const random = n => Math.floor(Math.random() * n);
      const state = { max:5, score:0, lives:3, phase:'intro', generation:0, count:0, pattern:[], paused:false, spawnTimer:null, spawnAt:0, remaining:0, messageTimer:null };
      function show(id){for(const name of ['intro','game','end']) $(name).hidden=name!==id}
      function speedLevel(){return Math.min(5,1+Math.floor(state.score/5))}
      function interval(){const sky=$('sky'),lanes=sky.clientWidth<430?2:3,travel=Math.max(160,sky.clientHeight-74-57),base=state.max===5?1050:800,step=state.max===5?90:60;return Math.max(base-step*(speedLevel()-1),Math.ceil(84*duration()/travel/lanes))}
      function duration(){return (state.max===5?7900:6500)-(state.max===5?450:350)*(speedLevel()-1)}
      function clearTimers(){clearTimeout(state.spawnTimer);clearTimeout(state.messageTimer);state.spawnTimer=null;state.messageTimer=null}
      function feedback(text){$('message').textContent=text;clearTimeout(state.messageTimer);state.messageTimer=setTimeout(()=>{$('message').textContent=''},750)}
      function update(){ $('score').textContent=`⭐ ${state.score}점`; $('speed').textContent=`🚀 속도 ${speedLevel()}`; $('hearts').textContent='❤️'.repeat(state.lives)+'🤍'.repeat(3-state.lives);$('hearts').setAttribute('aria-label',`남은 목숨 ${state.lives}개`) }
      function makeProblem(correct){const a=2+random(state.max-1),b=1+random(9),answer=a*b;let shown=answer;if(!correct){const offsets=[-2,-1,1,2,-a,a,-b,b];const candidates=offsets.map(n=>answer+n).filter(n=>n>0&&n!==answer);shown=candidates[random(candidates.length)]}return{a,b,shown,correct}}
      function finish(){if(state.phase!=='playing')return;state.phase='end';state.generation++;clearTimers();$('sky').querySelectorAll('.meteor').forEach(m=>m.remove());$('endMessage').innerHTML=`<strong>${state.score}점!</strong><br>맞는 식을 ${state.score}개 찾아냈어.`;show('end')}
      function spawn(){if(state.phase!=='playing'||state.paused)return;const sky=$('sky'),generation=state.generation;if(state.pattern.length===0){state.pattern=[true,false,true,false];for(let i=3;i>0;i--){const j=random(i+1);[state.pattern[i],state.pattern[j]]=[state.pattern[j],state.pattern[i]]}}const correct=state.pattern.shift();const active=new Set([...sky.querySelectorAll('.meteor')].map(m=>m.textContent));let problem=makeProblem(correct);for(let attempt=0;attempt<20&&active.has(`${problem.a} × ${problem.b} = ${problem.shown}`);attempt++)problem=makeProblem(correct);const lanes=sky.clientWidth<430?[25,75]:[17,50,83];const lane=lanes[state.count%lanes.length];const width=sky.clientWidth<430?Math.min(158,sky.clientWidth*.44):Math.min(170,sky.clientWidth*.29);const travel=Math.max(160,sky.clientHeight-74-57);const meteor=document.createElement('button');meteor.type='button';meteor.className='meteor';meteor.textContent=`${problem.a} × ${problem.b} = ${problem.shown}`;meteor.setAttribute('aria-label',meteor.textContent+' 운석');meteor.dataset.correct=String(problem.correct);meteor.style.setProperty('--left',`${lane}%`);meteor.style.setProperty('--width',`${width}px`);meteor.style.setProperty('--travel',`${travel}px`);meteor.style.setProperty('--duration',`${duration()}ms`);
        const select=event=>{if(state.generation!==generation||state.phase!=='playing'||state.paused||meteor.disabled)return;if(event.type==='pointerdown')event.preventDefault();meteor.disabled=true;meteor.classList.add(problem.correct?'hit':'wrong');if(problem.correct){const before=speedLevel();state.score++;if(speedLevel()>before){feedback(`속도 ${speedLevel()}단계! 🚀`);clearTimeout(state.spawnTimer);schedule(interval())}else feedback('정답! +1점 ✨')}else{state.lives--;feedback('아앗! 목숨 −1 💔')}update();setTimeout(()=>meteor.remove(),270);if(state.lives===0)finish()};
        meteor.addEventListener('pointerdown',select);meteor.addEventListener('click',select);
        meteor.addEventListener('animationend',()=>meteor.remove(),{once:true});sky.append(meteor);state.count++;
      }
      function schedule(delay){state.remaining=delay;state.spawnAt=Date.now();state.spawnTimer=setTimeout(()=>{state.spawnTimer=null;if(state.phase!=='playing'||state.paused)return;spawn();schedule(interval())},delay)}
      function start(){clearTimers();state.generation++;state.score=0;state.lives=3;state.count=0;state.pattern=[];state.paused=false;state.phase='playing';$('game').classList.remove('paused');$('pauseOverlay').hidden=true;$('message').textContent='';$('sky').querySelectorAll('.meteor').forEach(m=>m.remove());update();show('game');spawn();schedule(interval())}
      function pause(){if(state.phase!=='playing'||state.paused)return;state.paused=true;state.remaining=Math.max(0,state.remaining-(Date.now()-state.spawnAt));clearTimeout(state.spawnTimer);state.spawnTimer=null;$('game').classList.add('paused');$('pauseOverlay').hidden=false}
      function resume(){if(!state.paused)return;state.paused=false;$('game').classList.remove('paused');$('pauseOverlay').hidden=true;schedule(state.remaining)}
      document.querySelectorAll('.level').forEach(button=>button.addEventListener('click',()=>{state.max=Number(button.dataset.max);document.querySelectorAll('.level').forEach(item=>{const chosen=item===button;item.classList.toggle('selected',chosen);item.setAttribute('aria-pressed',chosen)})}));
      $('start').addEventListener('click',start);$('retry').addEventListener('click',start);$('pause').addEventListener('click',pause);$('resume').addEventListener('click',resume);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
    })();
  </script>
</body>
</html>
