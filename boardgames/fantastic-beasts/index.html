<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172a23">
  <meta name="description" content="한글과 영어로 찾아보는 신비한 동물사전.">
  <title>신비한 동물사전 · 마루 보드게임</title>
  <link rel="icon" href="../assets/site-icons/icon-32-v1.png">
  <style>
    :root{color-scheme:dark;--ink:#f6efdb;--muted:#c6c8b5;--gold:#f1cf88;--line:#536757;--panel:#20332b}
    *{box-sizing:border-box}
    body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 85% 0%,#344b38,transparent 35rem),#16241f;font-family:system-ui,"Malgun Gothic",sans-serif;line-height:1.6}
    main{width:min(100% - 32px,920px);margin:auto;padding:25px 0 46px}
    a{color:var(--gold);text-underline-offset:4px}
    button,input,summary{-webkit-tap-highlight-color:transparent}
    :focus-visible{outline:2px solid var(--gold);outline-offset:3px}
    .back{display:inline-block;padding:8px 0;font-size:.9rem}
    header{padding:22px 0 24px;border-bottom:1px solid var(--line);margin-bottom:18px}
    h1{font-family:Georgia,"Batang",serif;font-size:clamp(2rem,7vw,3.5rem);letter-spacing:-.06em;margin:0;color:var(--gold);overflow-wrap:anywhere}
    header p,footer,.english,#count{color:var(--muted)}
    header p{margin:5px 0 0}
    .search-label{display:block;margin-bottom:6px;font-weight:650}
    input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
    input::placeholder{color:var(--muted)}
    .index{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
    button{min-width:36px;min-height:42px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
    button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1e291f;font-weight:750}
    button:disabled{opacity:.4;cursor:default}
    #count{margin:12px 0 18px;font-size:.9rem}
    .group h2{margin:16px 0 8px;color:var(--gold);font-size:1.17rem}
    .entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:8px;align-items:start}
    details{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
    summary{min-height:62px;padding:9px 13px;cursor:pointer}
    summary strong{font-weight:720}
    .english{display:block;padding-left:17px;font-size:.86rem}
    details p{margin:0;padding:0 13px 12px 30px;font-size:.94rem}
    footer{border-top:1px solid var(--line);margin-top:30px;padding-top:14px;font-size:.83rem}
    footer p{margin:0 0 7px}
  </style>
</head>
<body>
<main>
  <a class="back" href="../">← 마루 보드게임</a>
  <header>
    <h1>신비한 동물사전</h1>
    <p>이름으로 검색하거나 초성을 눌러 마법 동물을 찾아봐.</p>
  </header>
  <label class="search-label" for="query">동물 찾기</label>
  <input id="query" type="search" placeholder="니플러, Niffler, 거미" autocomplete="off">
  <div class="index" id="index" role="group" aria-label="이름의 첫 글자"></div>
  <p id="count" role="status"></p>
  <div id="results"></div>
  <noscript>동물을 검색하려면 브라우저에서 JavaScript를 켜줘.</noscript>
  <footer>
    <p>2017년 개정판의 동물 항목을 바탕으로 짧게 정리했어. 한글 이름은 검색을 돕기 위한 한글 표기를 포함해.</p>
    <a href="https://www.jkrowling.com/book/fantastic-beasts-find/">개정판 소개</a> ·
    <a href="https://harrypotter.fandom.com/wiki/Fantastic_Beasts_and_Where_to_Find_Them_(companion_book)#Fantastic_Beasts_featured_(2017_edition)">등장 동물 목록</a>
  </footer>
</main>

    ["슈레이크","Shrake","온몸에 뾰족한 가시가 돋은 물고기야. 어망을 찢어 놓기도 해.","슈레이크 슈레이크"],
    ["스낼리개스터","Snallygaster","북아메리카에서 발견되는 날개 달린 생물이야. 새와 파충류를 함께 떠올리게 해.","스낼리개스터 스낼리게스터"],
    ["골든 스니젯","Golden Snidget","빠르게 방향을 바꾸며 날아다니는 금빛 새야. 퀴디치의 골든 스니치가 이 새를 본떠 만들어졌어.","스니젯 스니지트"],
    ["스핑크스","Sphinx","사람의 머리에 사자의 몸을 가졌어. 지나가려는 사람에게 수수께끼를 내기도 해."],
    ["스트릴러","Streeler","몸 색이 바뀌는 거대한 달팽이야. 지나간 자리에 남긴 점액은 식물에 해로워.","스트리러"],
    ["테보","Tebo","멧돼지를 닮은 동물이야. 투명해질 수 있어서 찾기가 어려워."],
    ["천둥새","Thunderbird","날개를 퍼덕이면 폭풍을 일으킬 수 있는 거대한 새야.","썬더버드 선더버드 천둥 새"],
    ["트롤","Troll","덩치가 크고 힘이 세. 산, 숲, 강을 터전으로 삼는 종류가 있어."],
    ["유니콘","Unicorn","이마에 뿔 하나가 달린 말이야. 어린 개체는 금빛을 띠고 자라면 하얘져."],
    ["왐퍼스 고양이","Wampus Cat","퓨마처럼 생긴 빠른 고양잇과 동물이야. 눈에는 특별한 힘이 있다고 해.","왐퍼스 캣 웜퍼스 고양이"],
    ["늑대인간","Werewolf","보름달이 뜨면 늑대의 모습으로 변하는 사람이야.","웨어울프 늑대 인간"],
    ["날개 달린 말","Winged Horse","날개를 달고 하늘을 나는 말이야. 아브락산과 세스트랄 같은 종류가 있어.","날개 달린 말 아브락산 에톤 그라니안 세스트랄 테스트랄"],
    ["예티","Yeti","히말라야에 산다고 알려진, 흰 털이 덮인 큰 생물이야.","설인"]];
  const initials = Array.from('ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ');
  const collator = new Intl.Collator('ko');
  const normalize = value => value.normalize('NFKC').toLowerCase().replace(/[\s\p{P}]+/gu, '');
  const firstLetter = name => initials[Math.floor((name.charCodeAt(0) - 0xac00) / 588)];
  const animals = entries.map(([name, english, summary, aliases = '']) => ({
    name, english, summary, initial: firstLetter(name),
    searchable: [name, english, summary, aliases].map(normalize)
  })).sort((left, right) => collator.compare(left.name, right.name));
  const query = document.querySelector('#query');
  const index = document.querySelector('#index');
  const count = document.querySelector('#count');
  const results = document.querySelector('#results');
  const present = new Set(animals.map(animal => animal.initial));
  let active = '';

  function makeEntry(animal, open) {
    const detail = document.createElement('details');
    detail.open = open;
    const title = document.createElement('summary');
    const name = document.createElement('strong');
    name.textContent = animal.name;
    const english = document.createElement('span');
    english.className = 'english';
    english.lang = 'en';
    english.textContent = animal.english;
    const summary = document.createElement('p');
    summary.textContent = animal.summary;
    title.append(name, english);
    detail.append(title, summary);
    return detail;
  }

  function render() {
    const term = normalize(query.value);
    const shown = animals.filter(animal => (!active || animal.initial === active)
      && (!term || animal.searchable.some(value => value.includes(term))));
    count.textContent = shown.length ? shown.length + '개 항목' : '찾은 동물이 없어. 다른 이름이나 초성으로 찾아봐.';
    for (const button of index.children) {
      button.setAttribute('aria-pressed', String(button.dataset.initial === active));
    }
    const groups = new Map();
    for (const animal of shown) {
      if (!groups.has(animal.initial)) {
        const section = document.createElement('section');
        section.className = 'group';
        const title = document.createElement('h2');
        title.textContent = animal.initial;
        const list = document.createElement('div');
        list.className = 'entries';
        section.append(title, list);
        groups.set(animal.initial, section);
      }
      groups.get(animal.initial).lastElementChild.append(makeEntry(animal, Boolean(term) && shown.length === 1));
    }
    results.replaceChildren(...groups.values());
  }

  for (const initial of ['', ...initials.filter(letter => !'ㄲㄸㅃㅆㅉ'.includes(letter) || present.has(letter))]) {
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.initial = initial;
    button.textContent = initial || '전체';
    button.disabled = Boolean(initial) && !present.has(initial);
    button.addEventListener('click', () => {
      active = initial;
      if (!initial) query.value = '';
      render();
    });
    index.append(button);
  }
  query.addEventListener('input', () => {
    active = '';
    render();
  });
  render();
</script>
</body>
</html>
