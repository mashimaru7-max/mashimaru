<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11131f">
  <meta name="description" content="눈송이와 함께 고르는 마루 보드게임. 원하는 게임을 골라 바로 시작하세요.">
  <title>마루 보드게임 · 오늘은 뭐 할까?</title>
  <link rel="stylesheet" href="shared/theme.css?v=4">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<div class="hub">
  <header class="hub-header">
    <a class="logo" href="./"><span class="logo-mark">m<span>●</span></span><strong>마루 <span>보드게임</span></strong></a>
    <span class="header-note">설치 없이, 바로 함께</span>
  </header>
  <main>
    <section class="welcome" aria-labelledby="library-title">
      <div><h1 id="library-title">오늘은 뭐 하고 <em>놀까?</em></h1><p>마음에 드는 게임을 골라 바로 시작해봐.</p></div>
      <img src="assets/nunsongi.webp" width="78" height="84" alt="손을 흔들며 반기는 눈송이" fetchpriority="high">
    </section>
    <section class="library" aria-label="게임 목록">
      <div class="catalog-controls">
        <div class="filter-group" role="group" aria-label="참가 인원 필터">
          <button class="filter active" data-players="all" aria-pressed="true">전체 <span id="game-count"></span></button>
          <button class="filter" data-players="1" aria-pressed="false">1명</button>
          <button class="filter" data-players="2" aria-pressed="false">2명</button>
          <button class="filter" data-players="3" aria-pressed="false">3명</button>
          <button class="filter" data-players="4" aria-pressed="false">4명</button>
          <button class="filter" data-players="5" aria-pressed="false">5명</button>
          <button class="filter" data-players="6" aria-pressed="false">6명</button>
        </div>
        <label class="search"><span aria-hidden="true">⌕</span><input id="game-search" type="search" placeholder="어떤 게임 찾고 있어?" aria-label="게임 이름 또는 태그 검색"></label>
      </div>
      <div id="game-grid" class="game-grid"></div>
      <p id="empty-state" class="empty-state" role="status" hidden>조건에 맞는 게임이 없어. 다른 이름이나 인원으로 찾아봐!</p>
    </section>
  </main>
  <footer><span>눈송이와 함께하는 작은 게임방</span><span>작은 화면, 커다란 웃음.</span></footer>
</div>
<script src="shared/ui.js"></script><script src="games.js?v=6"></script><script src="app.js?v=8"></script>
</body>
</html>
