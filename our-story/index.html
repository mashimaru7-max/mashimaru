<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="description"
      content="우리라는 이야기 — 가족 여행과 성장 아카이브의 예시 체험"
    />
    <title>우리라는 이야기 · 가족 아카이브</title>
    <link rel="stylesheet" href="vendor/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="vendor/leaflet.js" defer></script>
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <a class="skip" href="#main">본문으로</a>
    <header>
      <a class="brand" href="#home"
        ><span class="brand-mark">⌂</span
        ><span>우리라는 이야기<small>OUR FAMILY, OUR STORY</small></span></a
      >
      <nav aria-label="주 메뉴">
        <a href="#home">홈</a><a href="#travel">여행지도</a
        ><a href="#growth">성장앨범</a><a href="#gallery">갤러리</a>
      </nav>
      <button class="profile" data-action="about">
        ♡ <span>가족 체험</span>
      </button>
    </header>
    <div class="demo-banner">
      <span>예시 모드</span> 모든 사진과 이야기는 디자인 확인용입니다. 실제
      가족의 기록이 아닙니다.
    </div>
    <main id="main" tabindex="-1"></main>
    <footer>
      <a class="brand" href="#home">우리라는 이야기 ♡</a>
      <p>평범한 오늘이, 우리에게는 오래 남을 이야기.</p>
      <small
        >공개 UI 체험 · 실제 기록 0개 · 로그인 / NAS 연결 준비 중<br />입력은
        메모리에서만 유지되며 새로고침하면 사라집니다. 개인정보를 입력하지
        마세요.</small
      ><button data-action="credits">사진 및 지도 출처</button>
    </footer>
    <dialog id="dialog">
      <button class="close" aria-label="닫기" data-action="close">×</button>
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" role="status"></div>
  </body>
</html>
