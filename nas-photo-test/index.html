<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>NAS 사진 목록 테스트</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{background:#0f1420;color:#f1f5fc;margin:0}main{max-width:780px;margin:32px auto;padding:0 18px}h1{font-size:26px}p{color:#b9c6d9;line-height:1.6}.card{background:#1c2638;border:1px solid #35455e;border-radius:16px;padding:20px;margin:16px 0}label{display:block;color:#cad4e3;font-size:13px;margin:12px 0 6px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #53637c;background:#101828;color:white;font:inherit}button{background:#8fc3ff;color:#101b2b;border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;margin:5px 5px 5px 0}button:disabled{opacity:.4}button.secondary{background:#34455d;color:white}#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#c5e0ff;background:#101828;border-radius:9px;padding:12px}ul{list-style:none;padding:0;margin:0}li{border-bottom:1px solid #34435b;padding:8px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}li button{background:transparent;color:#e7f1ff;text-align:left;flex:1;font-weight:500;overflow-wrap:anywhere}.small{font-size:13px}.warn{color:#ffd5a0}#preview img{max-width:100%;max-height:450px;object-fit:contain;border-radius:10px}code{overflow-wrap:anywhere}a{color:#9bc7ff}</style></head><body><main>
<h1>📷 NAS 사진 목록 테스트</h1><p>DS218+ · Synology Photos 공유 폴더 · <strong>원본 읽기 전용</strong></p>
<section class="card"><strong>🔐 가족사진 로그인</strong><p class="small">아이디는 <b>maru</b>야. 최초 한 번만 비밀번호를 설정하고 이후 로그인하면 돼.</p><form id="loginForm"><label>Cloudflare HTTPS 주소</label><input id="url" type="url" required placeholder="https://example.trycloudflare.com"><label>아이디</label><input id="username" value="maru" readonly><label>비밀번호</label><input id="password" type="password" required autocomplete="current-password" minlength="12"><button type="submit">로그인</button><button type="button" class="secondary" id="reset">로그아웃</button></form><div id="setup" hidden><hr><h3>최초 비밀번호 설정</h3><p class="small">기존 NAS의 PHOTO_API_TOKEN은 최초 설정 인증에만 사용해. 이후 로그인에는 필요 없어.</p><form id="setupForm"><label>초기 설정 토큰</label><input id="setupToken" type="password" autocomplete="off" required><label>새 비밀번호 (12자 이상)</label><input id="newPassword" type="password" minlength="12" autocomplete="new-password" required><label>비밀번호 확인</label><input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required><button type="submit">비밀번호 최초 설정</button></form></div><p class="warn small">사진 원본은 읽기 전용. 비밀번호는 서버에서 해시로 보관하고 GitHub에 저장하지 않아. 임시 터널 주소는 재시작 시 바뀔 수 있어.</p></section>
<section class="card"><strong>조회 결과</strong><p id="status" role="status">대기 중</p><div id="crumb"></div><ul id="files"></ul><button id="more" hidden>다음 100개 보기</button><div id="preview"></div></section>
</main><script>
const $=id=>document.getElementById(id);
let base='',secret='',folder='',next=null,previewUrl=null;
const setStatus=s=>$('status').textContent=s;
function cleanPreview(){if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;$('preview').replaceChildren();}
function safeBase(value){const u=new URL(value);if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash||u.pathname!=='/')throw Error('올바른 HTTPS 터널 주소를 입력해.');if(!u.hostname.endsWith('.trycloudflare.com'))throw Error('Cloudflare Quick Tunnel 주소만 허용해.');return u.origin;}
async function request(route,params={},method='GET',body=null,authorized=true){const u=new URL(base+route);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v)));const ctrl=new AbortController(),timeout=setTimeout(()=>ctrl.abort(),15000);try{const headers={};if(authorized&&secret)headers.Authorization='Bearer '+secret;if(body!==null)headers['Content-Type']='application/json';const r=await fetch(u,{method,headers,body:body===null?undefined:JSON.stringify(body),mode:'cors',cache:'no-store',referrerPolicy:'no-referrer',signal:ctrl.signal});let data=null;if(!r.ok){try{data=await r.json();}catch{}throw Error(data?.error||'HTTP '+r.status);}return r;}finally{clearTimeout(timeout);}}
async function post(route,data){const r=await request(route,{},'POST',data,false);return r.json();}
function clear(){if(base&&secret)request('/api/logout',{},'POST',{},true).catch(()=>{});secret='';folder='';next=null;$('files').replaceChildren();$('crumb').replaceChildren();$('more').hidden=true;cleanPreview();setStatus('로그아웃됨');}
$('reset').onclick=clear;
async function load(path='',offset=0){if(!base||!secret)return;setStatus('폴더 목록 조회 중…');try{const res=await request('/api/list',{path,offset});const data=await res.json();folder=path;next=data.next;if(offset===0){$('files').replaceChildren();cleanPreview();}const crumb=$('crumb');crumb.replaceChildren();const home=document.createElement('button');home.className='secondary';home.textContent='📁 /photo';home.onclick=()=>load('');crumb.append(home);if(path){const text=document.createElement('span');text.textContent=' / '+path;crumb.append(text);}data.items.forEach(f=>{const li=document.createElement('li'),btn=document.createElement('button');btn.textContent=(f.dir?'📁 ':'🖼️ ')+f.name;btn.onclick=()=>f.dir?load(f.path):showImage(f.path,f.name);li.append(btn);$('files').append(li);});$('more').hidden=next===null;setStatus('조회 성공 · 현재 폴더 '+data.total+'개 항목 · 화면 '+$('files').children.length+'개 표시');}catch(e){if(e.message==='LOGIN_REQUIRED')secret='';setStatus('조회 실패: '+(e.name==='TypeError'?'네트워크/CORS/터널 연결 문제':e.message));}}
async function showImage(path,name){cleanPreview();setStatus('미리보기 불러오는 중…');try{const res=await request('/api/image',{path});const blob=await res.blob();previewUrl=URL.createObjectURL(blob);const h=document.createElement('p');h.textContent=name;const img=document.createElement('img');img.alt=name;img.src=previewUrl;$('preview').append(h,img);setStatus('사진 미리보기 로드 완료');}catch(e){setStatus('미리보기 실패: '+e.message);}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{base=safeBase($('url').value.trim());const data=await post('/api/login',{username:'maru',password:$('password').value});secret=data.session;$('password').value='';$('setup').hidden=true;await load('');}catch(e){if(e.message==='SETUP_REQUIRED'){$('setup').hidden=false;setStatus('최초 비밀번호 설정이 필요해. 아래에서 한 번 설정해.');}else setStatus('로그인 실패: '+(e.name==='TypeError'?'서버 연결 문제':e.message));}};
$('setupForm').onsubmit=async e=>{e.preventDefault();try{base=safeBase($('url').value.trim());const pw=$('newPassword').value;if(pw!==$('confirmPassword').value)throw Error('비밀번호가 일치하지 않아');await post('/api/setup',{setupToken:$('setupToken').value,password:pw});$('setupToken').value='';$('newPassword').value='';$('confirmPassword').value='';$('setup').hidden=true;setStatus('설정 완료! 위에서 maru 계정으로 로그인해.');}catch(e){setStatus('설정 실패: '+e.message);}};
$('more').onclick=()=>{if(next!==null)load(folder,next);};
</script></body></html>
