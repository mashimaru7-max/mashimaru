<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>NAS 사진 목록 테스트</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{background:#0f1420;color:#f1f5fc;margin:0}main{max-width:780px;margin:32px auto;padding:0 18px}h1{font-size:26px}p{color:#b9c6d9;line-height:1.6}.card{background:#1c2638;border:1px solid #35455e;border-radius:16px;padding:20px;margin:16px 0}label{display:block;color:#cad4e3;font-size:13px;margin:12px 0 6px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #53637c;background:#101828;color:white;font:inherit}button{background:#8fc3ff;color:#101b2b;border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;margin:5px 5px 5px 0}button:disabled{opacity:.4}button.secondary{background:#34455d;color:white}#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#c5e0ff;background:#101828;border-radius:9px;padding:12px}ul{list-style:none;padding:0;margin:0}li{border-bottom:1px solid #34435b;padding:8px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}li button{background:transparent;color:#e7f1ff;text-align:left;flex:1;font-weight:500;overflow-wrap:anywhere}.small{font-size:13px}.warn{color:#ffd5a0}.inline-preview{padding:14px;background:#101828;border:1px solid #435b79;border-radius:12px;margin:8px 0 14px}.inline-preview img{display:block;max-width:100%;max-height:min(70vh,600px);object-fit:contain;border-radius:10px;margin:auto}.inline-preview .preview-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;overflow-wrap:anywhere}.inline-preview .preview-head button{flex:0 0 auto}.inline-preview p{margin:8px 0}#files.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}#files.grid li{display:block;min-width:0;padding:0;border:1px solid #35455e;border-radius:12px;overflow:hidden;background:#121c2c}#files.grid li button{display:flex;flex-direction:column;align-items:stretch;width:100%;margin:0;padding:0;text-align:center}#files.grid .thumb{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#101828;font-size:38px;overflow:hidden}#files.grid .thumb img{width:100%;height:100%;object-fit:cover}#files.grid .filename{padding:8px 4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#files.grid .inline-preview{grid-column:1/-1}#files.list li .thumb{display:none}#files.list li .filename{overflow-wrap:anywhere}#files.grid li.preview-item{grid-column:1/-1;border:0;background:transparent}#viewtools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#viewtools button.active{background:#8fc3ff;color:#101b2b}@media(min-width:700px){#files.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}#preview{display:none}#crumb{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:14px 0}#crumb button{margin:2px}code{overflow-wrap:anywhere}a{color:#9bc7ff}</style></head><body><main>
<h1>📷 NAS 사진 목록 테스트</h1><p>DS218+ · Synology Photos 공유 폴더 · <strong>원본 읽기 전용</strong></p>
<section class="card"><strong>NAS 연결</strong><p class="small">Cloudflare 임시 터널 주소와 NAS에 설정한 사진 조회 토큰을 입력해. NAS 관리자 계정이나 비밀번호는 입력하지 마.</p><form id="connectForm"><label for="url">Cloudflare HTTPS 주소</label><input id="url" type="url" required placeholder="https://example.trycloudflare.com" autocomplete="off"><label for="token">사진 조회 토큰</label><input id="token" type="password" required autocomplete="off"><button type="submit">사진 목록 연결</button><button type="button" class="secondary" id="reset">연결 해제</button></form><p class="warn small">사진 원본은 읽기 전용. 임시 터널 주소는 재시작 시 바뀔 수 있어.</p></section>
<section class="card"><strong>조회 결과</strong><p id="status" role="status">대기 중</p><div id="crumb"></div><div id="viewtools"><button type="button" id="gridBtn" class="secondary">▦ 그리드</button><button type="button" id="listBtn" class="secondary">☰ 목록</button></div><ul id="files" class="grid"></ul><button id="more" hidden>다음 100개 보기</button><div id="preview"></div></section>
</main><script>
const $=id=>document.getElementById(id);
let base='',secret='',folder='',next=null,previewUrl=null,previewBox=null,view='grid',generation=0;const thumbUrls=new Set();let pendingThumbs=[],activeThumbs=0;const thumbObserver=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){thumbObserver.unobserve(entry.target);pendingThumbs.push({el:entry.target,path:entry.target.dataset.path,gen:generation});pumpThumbs();}})},{rootMargin:'180px'});function resetThumbs(){generation++;pendingThumbs=[];thumbObserver.disconnect();thumbUrls.forEach(u=>URL.revokeObjectURL(u));thumbUrls.clear();}function pumpThumbs(){while(activeThumbs<3&&pendingThumbs.length){const job=pendingThumbs.shift();if(job.gen!==generation)continue;activeThumbs++;request('/api/image',{path:job.path}).then(r=>r.blob()).then(blob=>{if(job.gen!==generation)return;const u=URL.createObjectURL(blob);thumbUrls.add(u);const img=document.createElement('img');img.alt='';img.src=u;job.el.replaceChildren(img);}).catch(()=>{if(job.gen===generation)job.el.textContent='🖼️';}).finally(()=>{activeThumbs--;pumpThumbs();});}}function setView(v){view=v;$('files').className=v;$('gridBtn').className=v==='grid'?'active':'secondary';$('listBtn').className=v==='list'?'active':'secondary';document.querySelectorAll('#files .thumb').forEach(el=>{if(v==='grid'&&!el.dataset.loaded&&!el.dataset.queued){el.dataset.queued='1';thumbObserver.observe(el);}});}
const setStatus=s=>$('status').textContent=s;
function cleanPreview(){if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;if(previewBox)previewBox.remove();previewBox=null;}
function safeBase(value){const u=new URL(value);if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash||u.pathname!=='/')throw Error('올바른 HTTPS 터널 주소를 입력해.');if(!u.hostname.endsWith('.trycloudflare.com'))throw Error('Cloudflare Quick Tunnel 주소만 허용해.');return u.origin;}
async function request(route,params={}){const u=new URL(base+route);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v)));const ctrl=new AbortController(),timeout=setTimeout(()=>ctrl.abort(),15000);try{const r=await fetch(u,{headers:{Authorization:'Bearer '+secret},mode:'cors',cache:'no-store',referrerPolicy:'no-referrer',signal:ctrl.signal});if(!r.ok){let data=null;try{data=await r.json();}catch{}throw Error(data?.error||'HTTP '+r.status);}return r;}finally{clearTimeout(timeout);}}
function clear(){resetThumbs();base='';secret='';folder='';next=null;$('token').value='';$('files').replaceChildren();$('crumb').replaceChildren();$('more').hidden=true;cleanPreview();setStatus('연결 해제됨');}
$('reset').onclick=clear;$('gridBtn').onclick=()=>setView('grid');$('listBtn').onclick=()=>setView('list');setView('grid');
async function load(path='',offset=0){if(!base||!secret)return;setStatus('폴더 목록 조회 중…');try{const res=await request('/api/list',{path,offset});const data=await res.json();folder=path;next=data.next;if(offset===0){resetThumbs();$('files').replaceChildren();cleanPreview();}const crumb=$('crumb');crumb.replaceChildren();{const back=document.createElement('button');back.className='secondary';back.textContent='⬅ 상위 폴더';back.disabled=!path;back.onclick=()=>load(path.split('/').filter(Boolean).slice(0,-1).join('/'));crumb.append(back);}const home=document.createElement('button');home.className='secondary';home.textContent='📁 /photo';home.onclick=()=>load('');crumb.append(home);let accumulated='';path.split('/').filter(Boolean).forEach(segment=>{accumulated+=(accumulated?'/':'')+segment;const target=accumulated;const separator=document.createElement('span');separator.textContent=' / ';crumb.append(separator);const part=document.createElement('button');part.className='secondary';part.textContent=segment;part.onclick=()=>load(target);crumb.append(part);});data.items.forEach(f=>{const li=document.createElement('li'),btn=document.createElement('button'),thumb=document.createElement('span'),name=document.createElement('span');thumb.className='thumb';thumb.textContent=f.dir?'📁':'🖼️';name.className='filename';name.textContent=f.name;btn.title=f.name;btn.append(thumb,name);btn.onclick=()=>f.dir?load(f.path):showImage(f.path,f.name,li);li.append(btn);$('files').append(li);if(!f.dir){thumb.dataset.path=f.path;if(view==='grid'){thumb.dataset.queued='1';thumbObserver.observe(thumb);}}});setView(view);$('more').hidden=next===null;setStatus('조회 성공 · 현재 폴더 '+data.total+'개 항목 · 화면 '+$('files').children.length+'개 표시');}catch(e){setStatus('조회 실패: '+(e.name==='TypeError'?'네트워크/CORS/터널 연결 문제':e.message));}}
async function showImage(path,name,li){cleanPreview();const panel=document.createElement('div');panel.className='inline-preview';previewBox=panel;const header=document.createElement('div');header.className='preview-head';const title=document.createElement('strong');title.textContent=name;const close=document.createElement('button');close.className='secondary';close.textContent='✕ 닫기';close.onclick=cleanPreview;header.append(title,close);const msg=document.createElement('p');msg.textContent='사진 불러오는 중…';panel.append(header,msg);const wrapper=document.createElement('li');wrapper.className='preview-item';wrapper.append(panel);li.insertAdjacentElement('afterend',wrapper);previewBox=wrapper;panel.scrollIntoView({behavior:'smooth',block:'nearest'});try{const res=await request('/api/image',{path});const blob=await res.blob();if(previewBox!==wrapper)return;previewUrl=URL.createObjectURL(blob);const img=document.createElement('img');img.alt=name;img.src=previewUrl;msg.replaceWith(img);setStatus('사진 미리보기 로드 완료');}catch(e){if(previewBox===wrapper)msg.textContent='미리보기 실패: '+e.message;}}
$('connectForm').onsubmit=e=>{e.preventDefault();try{base=safeBase($('url').value.trim());secret=$('token').value.trim();if(secret.length<32)throw Error('토큰은 최소 32자 이상이어야 해.');$('token').value='';load('');}catch(e){setStatus(e.message);}};
$('more').onclick=()=>{if(next!==null)load(folder,next);};
</script></body></html>
