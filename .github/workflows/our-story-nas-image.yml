name: Build Our Story NAS service image
on:
  push:
    paths:
      - 'our-story/nas-service/**'
      - '.github/workflows/our-story-nas-image.yml'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test the isolated NAS service
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install Pillow==13.0.0
          python -m unittest discover -s our-story/tests -p test_nas_service.py -v
          python -m unittest discover -s our-story/tests -p test_journal_store.py -v
          python -m unittest discover -s our-story/tests -p test_file_management.py -v
          python -m unittest discover -s our-story/tests -p test_permanent_trash.py -v
          python -m unittest discover -s our-story/tests -p test_video_service.py -v
          python -m unittest discover -s our-story/tests -p test_video_thumbnails.py -v
          python -m unittest discover -s our-story/tests -p test_travel_store.py -v
      - name: Build and export amd64 image for DS218+
        run: |
          docker build --platform linux/amd64 -t our-story-nas:2 our-story/nas-service
          docker save -o our-story-nas-amd64.tar our-story-nas:2
      - uses: actions/upload-artifact@v4
        with:
          name: our-story-nas-amd64
          path: our-story-nas-amd64.tar
          retention-days: 7
          compression-level: 0
      - name: Package portable ffmpeg runtime for existing Synology container
        run: |
          mkdir -p thumbnail-runtime
          docker run --rm --user 0 --entrypoint python \
            -v "$PWD/our-story/nas-service:/source:ro" \
            -v "$PWD/thumbnail-runtime:/export" \
            our-story-nas:2 /source/tools/package-ffmpeg.py
      - uses: actions/upload-artifact@v4
        with:
          name: our-story-video-thumbnails
          path: thumbnail-runtime/our-story-video-thumbnails.tar.gz
          retention-days: 30
          compression-level: 0
      - name: Publish the family thumbnail installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view our-story-video-thumbnails >/dev/null 2>&1; then
            gh release create our-story-video-thumbnails --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "우리라는 이야기 · 영상 썸네일 설치 파일" \
              --notes "기존 API 컨테이너용 ffmpeg 런타임과 server.py입니다. 기존 NAS 사진과 설정은 포함하지 않습니다. 설치 순서는 압축 파일의 INSTALL.txt를 참고하세요."
          fi
          gh release upload our-story-video-thumbnails thumbnail-runtime/our-story-video-thumbnails.tar.gz --clobber
